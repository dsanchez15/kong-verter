[project]
name = "kong-verter"
version = "0.1.0"
description = "Video to MP3 converter and other media utilities"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=1.0.3",
    "customtkinter>=5.2.2",
    "faster-whisper>=1.0.0",
    "SpeechRecognition>=3.10.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "moviepy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "customtkinter"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
